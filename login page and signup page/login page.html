<p class="font-body-md text-body-md text-on-surface-variant text-center mt-base">Join the next generation of engineers.</p>
</div>
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullName">Full Name</label>
<div class="relative rounded-md input-glow transition-shadow duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-outline-variant rounded-md py-3 focus:ring-0 focus:border-secondary transition-colors duration-200 bg-surface-container-lowest text-on-surface" id="fullName" name="fullName" placeholder="Ada Lovelace" type="text">
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<div class="relative rounded-md input-glow transition-shadow duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-outline-variant rounded-md py-3 focus:ring-0 focus:border-secondary transition-colors duration-200 bg-surface-container-lowest text-on-surface" id="email" name="email" placeholder="you@example.com" type="email">
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<div class="relative rounded-md input-glow transition-shadow duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 sm:text-sm border-outline-variant rounded-md py-3 focus:ring-0 focus:border-secondary transition-colors duration-200 bg-surface-container-lowest text-on-surface" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
<div class="pt-base">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md font-medium text-on-primary bg-primary-container hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-opacity duration-200" type="submit">
                        Create Account
                    </button>
</div>
</form>
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>

</div>
</div>

<span class="material-symbols-outlined mr-2 text-on-surface" style="font-size: 20px;">code</span>

<span class="material-symbols-outlined mr-2 text-on-surface" style="font-size: 20px;">travel_explore</span>
                            Google

</div>
